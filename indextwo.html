<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Hunt - Clicker Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            overflow: hidden;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 107, 107, 0.2);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.1);
        }

        header > div:first-child {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff6b6b, #ffa07a, #ff8e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header > div:last-child {
            display: flex;
            gap: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .score-value {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ff8e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #gameArea {
            position: relative;
            width: 100%;
            flex: 1;
            background: radial-gradient(circle at 50% 50%, rgba(255, 107, 107, 0.08) 0%, transparent 70%);
            overflow: hidden;
        }

        .game-object {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            position: absolute;
            display: none;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
            border: 2px solid transparent;
        }

        #dot {
            background: linear-gradient(135deg, #ff6b6b, #ff8e72);
            cursor: pointer;
            border: 2px solid #ff8e72;
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.4);
        }

        #dot:hover {
            transform: scale(1.15);
            box-shadow: 0 15px 50px rgba(255, 107, 107, 0.6);
        }

        #dot:active {
            transform: scale(0.9);
        }

        .obstacle {
            background: linear-gradient(135deg, #64748b, #475569);
            cursor: not-allowed;
            border: 2px solid #475569;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .obstacle:hover {
            transform: scale(1.05);
        }

        #startScreen, #gameOver {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #startScreen h1, #gameOver h1 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ffa07a, #ff8e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        #startScreen p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.8;
        }

        #gameOver p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .difficulty-info {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        button {
            padding: 16px 48px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b6b, #ff8e72);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid transparent;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 45px rgba(255, 107, 107, 0.5);
            border-color: #ffa07a;
        }

        button:active {
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 60px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b, #ff8e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .record-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .accuracy {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        .accuracy-item {
            font-size: 14px;
            color: #cbd5e1;
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            header > div:first-child {
                font-size: 24px;
            }

            header > div:last-child {
                gap: 20px;
            }

            #startScreen h1, #gameOver h1 {
                font-size: 40px;
            }

            #startScreen p {
                font-size: 16px;
            }

            .game-object {
                width: 65px;
                height: 65px;
                font-size: 36px;
            }

            button {
                padding: 14px 36px;
                font-size: 14px;
            }

            .stats {
                gap: 40px;
            }

            .stat-value {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 12px 15px;
            }

            header > div:first-child {
                font-size: 20px;
            }

            .score-label {
                font-size: 9px;
            }

            .score-value {
                font-size: 16px;
            }

            #startScreen h1, #gameOver h1 {
                font-size: 32px;
            }

            #startScreen p {
                font-size: 14px;
            }

            .game-object {
                width: 60px;
                height: 60px;
                font-size: 32px;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>🎮 MONSTER HUNT</div>
        <div>
            <div class="score-item">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Best</div>
                <div class="score-value" id="best">0</div>
            </div>
        </div>
    </header>

    <div id="gameArea">
        <div id="dot" class="game-object">👹</div>

        <div id="startScreen">
            <h1>MONSTER HUNT</h1>
            <p>Click on monsters as fast as you can and reach a new high score! Avoid the obstacles or you'll lose!</p>
            <button onclick="startGame()">START GAME</button>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Your Record</div>
                    <div class="stat-value" id="bestScore">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Difficulty</div>
                    <div class="stat-value" id="difficultyDisplay">Easy</div>
                </div>
            </div>
        </div>

        <div id="gameOver" style="display:none;">
            <h1>GAME OVER</h1>
            <div id="recordAlert" class="record-badge" style="display: none;">
                🏆 NEW RECORD! 🏆
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Final Score</div>
                    <div class="stat-value" id="finalScore">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Difficulty Level</div>
                    <div class="stat-value" id="finalDifficulty">Easy</div>
                </div>
            </div>
            <div class="accuracy">
                <div class="accuracy-item">✓ Correct Clicks: <span id="correctClicks">0</span></div>
                <div class="accuracy-item">✗ Wrong Clicks: <span id="wrongClicks">0</span></div>
                <div class="accuracy-item">📊 Accuracy: <span id="accuracy">0</span>%</div>
            </div>
            <button onclick="startGame()" style="margin-top: 30px;">NEW GAME</button>
        </div>
    </div>

    <script>
        const dot = document.getElementById("dot");
        const gameArea = document.getElementById("gameArea");
        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOver");

        const monsters = ["👹", "👺", "👻", "☠️", "😈", "🐉"];
        const obstacles = ["🧱", "🚫", "⚠️", "🔒", "💥"];

        let score = 0;
        let best = parseInt(localStorage.getItem("bestScore")) || 0;
        let moveTime = 1000;
        let timeout;
        let running = false;
        let wrongClicks = 0;
        let correctClicks = 0;
        let currentObjectId = 0;
        let isMonster = true;

        // Initialize best score display
        document.getElementById("best").innerText = best;
        document.getElementById("bestScore").innerText = best;
        updateDifficultyDisplay();

        function getDifficultyLevel() {
            if (moveTime >= 900) return "Easy";
            if (moveTime >= 700) return "Medium";
            if (moveTime >= 500) return "Hard";
            if (moveTime >= 300) return "Extreme";
            return "Insane";
        }

        function updateDifficultyDisplay() {
            document.getElementById("difficultyDisplay").innerText = getDifficultyLevel();
        }

        function randomPos() {
            const maxX = gameArea.clientWidth - 70;
            const maxY = gameArea.clientHeight - 70;

            if (maxX > 0 && maxY > 0) {
                dot.style.left = Math.random() * maxX + "px";
                dot.style.top = Math.random() * maxY + "px";
            }
        }

        function spawnObject() {
            // Random chance for obstacle (increases with difficulty)
            const obstacleChance = Math.min(0.3 + (score * 0.02), 0.6);
            isMonster = Math.random() > obstacleChance;

            if (isMonster) {
                dot.textContent = monsters[Math.floor(Math.random() * monsters.length)];
                dot.classList.remove("obstacle");
                dot.cursor = "pointer";
            } else {
                dot.textContent = obstacles[Math.floor(Math.random() * obstacles.length)];
                dot.classList.add("obstacle");
                dot.cursor = "not-allowed";
            }

            randomPos();
            dot.style.display = "flex";
            dot.id = "dot-" + currentObjectId++;
        }

        function endGame() {
            running = false;
            dot.style.display = "none";
            clearTimeout(timeout);

            document.getElementById("finalScore").innerText = score;
            document.getElementById("finalDifficulty").innerText = getDifficultyLevel();
            document.getElementById("correctClicks").innerText = correctClicks;
            document.getElementById("wrongClicks").innerText = wrongClicks;

            const totalClicks = correctClicks + wrongClicks;
            const accuracyPercent = totalClicks > 0 ? Math.round((correctClicks / totalClicks) * 100) : 0;
            document.getElementById("accuracy").innerText = accuracyPercent;

            const isNewRecord = score > best;
            const recordAlert = document.getElementById("recordAlert");

            if (isNewRecord) {
                best = score;
                localStorage.setItem("bestScore", best);
                document.getElementById("best").innerText = best;
                recordAlert.style.display = "block";
            } else {
                recordAlert.style.display = "none";
            }

            gameOverScreen.style.display = "flex";
        }

        function moveObject() {
            if (!running) return;

            spawnObject();
            clearTimeout(timeout);
            timeout = setTimeout(endGame, moveTime);
        }

        dot.onclick = () => {
            if (!running) return;

            if (isMonster) {
                clearTimeout(timeout);
                score++;
                correctClicks++;
                document.getElementById("score").innerText = score;

                // Increase difficulty every 3 clicks (faster progression)
                // Minimum 250ms, starting from 1000ms
                if (score % 3 === 0 && moveTime > 250) {
                    moveTime -= 40;
                    updateDifficultyDisplay();
                }

                moveObject();
            } else {
                // Wrong click on obstacle
                wrongClicks++;
                endGame();
            }
        };

        function startGame() {
            score = 0;
            moveTime = 1000;
            wrongClicks = 0;
            correctClicks = 0;
            currentObjectId = 0;
            running = true;

            document.getElementById("score").innerText = score;
            updateDifficultyDisplay();
            gameOverScreen.style.display = "none";
            startScreen.style.display = "none";

            moveObject();
        }

        // Handle window resize
        window.addEventListener("resize", () => {
            if (running) {
                randomPos();
            }
        });
    </script>
</body>

</html>
